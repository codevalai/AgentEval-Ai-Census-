name: Planetary Telemetry & Merkle Spine Sink

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    # Hourly export to repository telemetry ledger
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      publish_release_snapshot:
        description: 'Publish snapshot as GitHub release asset'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telemetry-export:
    name: Export Census Snapshots & Merkle Ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: rm -f bun.lock package-lock.json && npm install --no-audit --no-fund --legacy-peer-deps

      - name: Export Planetary Census Snapshot & Epoch Witness to JSON
        run: npx tsx scripts/telemetry-sync-export.ts

      - name: Upload Telemetry Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: planetary-census-telemetry-bundle
          path: data/telemetry/
          retention-days: 30
