name: Sovereign Guardrail Spine — Constitutional Court CI

on:
  pull_request:
    branches: [main, master, stable, "release/*"]
  push:
    branches: [main, master, stable, "release/*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  stage_1_structural_and_critical_guardian:
    name: "Stage 1: TypeScript, Zod Schemas & Critical File Guardian"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository (Full History for Signature Verification)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: rm -f bun.lock package-lock.json && npm install --no-audit --no-fund --legacy-peer-deps

      - name: Verify TypeScript Strict Compilation & Zod Schemas
        run: npm run lint

      - name: Critical File Guardian — Enforce Labels & 2+ Human Approvals
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch origin "$BASE_REF" --depth=50 || true
          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" || git diff --name-only HEAD~1...HEAD || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -E "^(src/schemas/|src/services/reconciler-and-tiers-live\.ts|src/services/hyper-crawler-engine\.ts|supabase/migrations/)"; then
            echo "Sacred Sovereign Core files touched. Verifying 'critical-change' or 'ssot-change' label..."
            if ! echo "$PR_LABELS" | grep -E "critical-change|ssot-change"; then
              echo "::error::Sacred files modified without required 'critical-change' or 'ssot-change' label."
              exit 1
            fi
          fi

  stage_2_ssot_invariants_and_kahn_dag:
    name: "Stage 2: SSOT Conservation (Δ = 0) & Kahn Acyclic DAG Proof"
    needs: stage_1_structural_and_critical_guardian
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: rm -f bun.lock package-lock.json && npm install --no-audit --no-fund --legacy-peer-deps

      - name: Verify Hare-Niemeyer Conservation (Δ = 0) & Kahn 30-Discipline DAG
        run: npx tsx scripts/ssot-dag-verify.ts

  stage_3_supply_chain_sbom_and_allowlist:
    name: "Stage 3: Supply-Chain Registry Allowlist & CycloneDX SBOM"
    needs: stage_2_ssot_invariants_and_kahn_dag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Zero Untrusted Git URLs in Manifests
        run: |
          if grep -E '"(git\+|github:)' package.json; then
            echo "::error::Untrusted direct Git dependency detected in package.json"
            exit 1
          fi
          if [ -f package-lock.json ] && grep -E '"resolved":\s*"git\+' package-lock.json; then
            echo "::error::Untrusted direct Git dependency detected in package-lock.json"
            exit 1
          fi
          echo "Supply-chain registry allowlist verified (0 untrusted Git URLs)."

      - name: Generate CycloneDX SBOM Attestation
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cyclonedx.json || true

  stage_4_merkle_attestation_and_build_gate:
    name: "Stage 4: Cryptographic Merkle Root Attestation & Production Build"
    needs: stage_3_supply_chain_sbom_and_allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: rm -f bun.lock package-lock.json && npm install --no-audit --no-fund --legacy-peer-deps

      - name: Verify Cryptographic Merkle Root Attestation
        run: npx tsx scripts/replay-verify.ts

      - name: Build Production Bundle
        run: npm run build

