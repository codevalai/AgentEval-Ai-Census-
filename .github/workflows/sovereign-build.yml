name: Sovereign Infinity CI & Merkle Spine Replay

on:
  push:
    branches: [ "main", "master", "release/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      force_full_replay:
        description: 'Force full cryptographic state tree replay'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build, Typecheck, Lint & Replay Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: rm -f bun.lock package-lock.json && npm install --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck & Lint Core Codebase
        run: npm run lint

      - name: Production Vite Build
        run: npm run build

      - name: Execute Deterministic Merkle Replay & 7-Dimension SSOT Verifier
        run: npx tsx scripts/replay-verify.ts

      - name: Generate Sigstore Cosign Attestation
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-ci-merkle-witness
          path: |
            dist/
          retention-days: 14
