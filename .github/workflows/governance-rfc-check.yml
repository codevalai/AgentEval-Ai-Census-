name: Governance & RFC-001..005 Policy Gatekeeper

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rfc-governance-eval:
    name: OPA/Rego Policies & Z3 SMT-LIB2 Solver Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: rm -f bun.lock package-lock.json && npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run Formal Z3 SMT-LIB2 & Zero-Drift SSOT Verification
        run: npx tsx scripts/governance-rfc-verify.ts
