name: Planetary Threat Radar & Telemetry Patrol

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    # Run every 15 minutes across planetary threat vectors
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      threat_level_filter:
        description: 'Minimum DEFCON level to audit'
        required: false
        default: 'DEFCON_3'
        type: choice
        options:
          - DEFCON_1
          - DEFCON_2
          - DEFCON_3
          - ALL

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patrol-threat-radar:
    name: GPU Clamping, CUDA Traps & PQC Jitter Patrol
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: rm -f bun.lock package-lock.json && npm install --no-audit --no-fund --legacy-peer-deps

      - name: Execute Planetary CVE, ML-KEM-1024 Jitter & CUDA Trap Patrol
        run: npx tsx scripts/threat-radar-verify.ts
